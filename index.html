<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAWA - Medias Kawaii Premium</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">NAWA 💖</div>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#" onclick="verCarrito()">Carrito (<span id="cartCount">0</span>)</a>
    </nav>
</header>

<section class="hero" id="inicio">
    <h1>NAWA</h1>
    <p>Medias de Calidad Premium - Suaves, Kawaii y Duraderas ✨</p>
    <div class="botones-whatsapp">
        <a href="https://wa.me/51967414343" class="btn-whatsapp" target="_blank">COMPRAR POR WHATSAPP 💖</a>
    </div>
</section>

<section id="catalogo" class="catalogo">
    <h2>Nuestro Catálogo 🧦</h2>
    <div class="grid" id="productGrid"></div>
</section>

<!-- CARRITO -->
<div id="carritoModal" class="modal">
    <div class="modal-content">
        <span onclick="cerrarCarrito()" class="close">&times;</span>
        <h2>Tu Carrito 🛒</h2>
        <div id="cartItems"></div>
        <h3>Total: S/ <span id="cartTotal">0</span></h3>
        <button class="btn-whatsapp" onclick="pagarWhatsapp()">Pedir por WhatsApp</button>
    </div>
</div>

<script>
const productos = [
    {id:1, name:"Alo Black", price:15, img:"Alo Black.jpeg"},
    {id:2, name:"Alo White", price:15, img:"Alo White.jpeg"},
    {id:3, name:"Alo Beige", price:15, img:"Alo beige.jpeg"},
    {id:4, name:"Argyle", price:15, img:"argyle.jpeg"},
    {id:5, name:"FIL A", price:15, img:"FIL A.jpeg"},
    {id:6, name:"Kitty", price:15, img:"kitty.jpeg"},
    {id:7, name:"Nickelodeon", price:18, img:"nickelodeon.jpeg"},
    {id:8, name:"Vans Snoopy", price:18, img:"vans snoopy.jpeg"}
];

let cart = [];
const grid = document.getElementById('productGrid');
productos.forEach(p=>{
    grid.innerHTML+=`
    <div class="card">
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>S/ ${p.price}</p>
        <button onclick="addCart(${p.id})">Agregar</button>
    </div>`;
});

function addCart(id){
    const prod = productos.find(x=>x.id===id);
    const found = cart.find(x=>x.id===id);
    if(found) found.qty++;
    else cart.push({...prod, qty:1});
    actualizarCarrito();
}
function actualizarCarrito(){
    document.getElementById('cartCount').textContent = cart.reduce((a,b)=>a+b.qty,0);
    const cont = document.getElementById('cartItems');
    cont.innerHTML='';
    let total=0;
    cart.forEach(p=>{
        total+=p.price*p.qty;
        cont.innerHTML+=`<p>${p.name} x${p.qty} - S/ ${p.price*p.qty}</p>`;
    });
    document.getElementById('cartTotal').textContent=total;
}
function verCarrito(){document.getElementById('carritoModal').style.display='block';}
function cerrarCarrito(){document.getElementById('carritoModal').style.display='none';}

function pagarWhatsapp(){
    if(cart.length===0){ alert('Carrito vacío'); return; }
    let msg = 'Hola NAWA! 💖 Quiero pedir:%0A';
    cart.forEach(p=>{ msg+=`%0A- ${p.name} x${p.qty} = S/ ${p.price*p.qty}`; });
    msg+=`%0A%0ATOTAL: S/ ${document.getElementById('cartTotal').textContent}`;
    // SOLO TU NUMERO
    window.open('https://wa.me/51967414343?text='+msg, '_blank');
}
</script>
</body>
</html>
